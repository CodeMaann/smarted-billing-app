<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" fill="#ffffff" />
  
  <g transform="translate(256, 256)">
    <!-- 1. Base Loop B (rotated -45 deg: lobes at Top-Right & Bottom-Left) -->
    <g transform="rotate(-45)">
      <path d="M -145 -42 L 145 -42 A 42 42 0 0 1 145 42 L -145 42 A 42 42 0 0 1 -145 -42 Z" fill="none" stroke="#000000" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- 2. Base Loop A (rotated 45 deg: lobes at Top-Left & Bottom-Right) -->
    <g transform="rotate(45)">
      <path d="M -145 -42 L 145 -42 A 42 42 0 0 1 145 42 L -145 42 A 42 42 0 0 1 -145 -42 Z" fill="none" stroke="#000000" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- 3. Overpasses for Loop B (at Right and Left): -->
    <g transform="rotate(-45)">
      <!-- Right Overpass: at local (R, R) -->
      <path d="M 8 42 L 76 42" fill="none" stroke="#ffffff" stroke-width="56" stroke-linecap="butt" />
      <path d="M 8 42 L 76 42" fill="none" stroke="#000000" stroke-width="40" stroke-linecap="butt" />

      <!-- Left Overpass: at local (-R, -R) -->
      <path d="M -76 -42 L -8 -42" fill="none" stroke="#ffffff" stroke-width="56" stroke-linecap="butt" />
      <path d="M -76 -42 L -8 -42" fill="none" stroke="#000000" stroke-width="40" stroke-linecap="butt" />
    </g>

    <!-- 4. Overpasses for Loop A (at Top and Bottom): -->
    <g transform="rotate(45)">
      <!-- Top Overpass: at local (-R, -R) -->
      <path d="M -76 -42 L -8 -42" fill="none" stroke="#ffffff" stroke-width="56" stroke-linecap="butt" />
      <path d="M -76 -42 L -8 -42" fill="none" stroke="#000000" stroke-width="40" stroke-linecap="butt" />

      <!-- Bottom Overpass: at local (R, R) -->
      <path d="M 8 42 L 76 42" fill="none" stroke="#ffffff" stroke-width="56" stroke-linecap="butt" />
      <path d="M 8 42 L 76 42" fill="none" stroke="#000000" stroke-width="40" stroke-linecap="butt" />
    </g>
  </g>
</svg>